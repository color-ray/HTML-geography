function err(m){console.error(m); $("info").innerHTML=`<div class="err"><b>오류</b><br>${m}</div>`;}
function ids(){return new Set(GIS_DATA.points.map(p=>p.id));}
function validate(){
 if(!GIS_DATA||!Array.isArray(GIS_DATA.points)||GIS_DATA.points.length===0) throw new Error("points 데이터가 비어 있음");
 const set=ids(), bad=GIS_DATA.connections.filter(c=>!set.has(c.from)||!set.has(c.to));
 if(bad.length) console.warn("잘못된 연결 제거됨", bad);
 GIS_DATA.connections=GIS_DATA.connections.filter(c=>set.has(c.from)&&set.has(c.to));
 GIS_DATA.points.forEach(p=>{p.category=p.category||"city"; p.industries=p.industries||[]; p.companies=p.companies||[];});
}
function init(){
 try{
  validate();
  [...new Set(GIS_DATA.points.map(p=>p.region))].sort().forEach(r=>{const o=document.createElement("option");o.value=r;o.textContent=r;$("region").appendChild(o);});
  if(typeof L==="undefined") throw new Error("Leaflet 로드 실패: 인터넷 연결을 확인하세요.");
  map=L.map("map",{worldCopyJump:true,minZoom:2,maxZoom:10,preferCanvas:true}).setView([20,20],2);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{subdomains:"abcd",noWrap:false,maxZoom:19,attribution:"&copy; OpenStreetMap contributors &copy; CARTO"}).addTo(map);
  lineLayer=L.layerGroup().addTo(map); bufferLayer=L.layerGroup().addTo(map); heatLayer=L.layerGroup().addTo(map); pointLayer=L.layerGroup().addTo(map); measureLayer=L.layerGroup().addTo(map);
  L.control.layers({},{"교통망":lineLayer,"버퍼":bufferLayer,"규모 원":heatLayer,"도시·요충지":pointLayer,"거리 측정":measureLayer},{collapsed:false}).addTo(map);
  bind(); renderAll(); setTimeout(()=>{map.invalidateSize(true);fitAll();},300);
  map.on("moveend zoomend",renderMap); map.on("click",mapClick);
  console.log("정상 로드", GIS_DATA.points.length, "points", GIS_DATA.connections.length, "connections");

}
function bind(){

}
function get(id){return GIS_DATA.points.find(p=>p.id===id);}
function visiblePoints(){
 return GIS_DATA.points.filter(p=>{
  const okRegion=region==="all"||p.region===region;
  const hay=[p.name,p.ko,p.country,p.region,...p.industries,...p.companies].join(" ").toLowerCase();
  return okRegion&&(!search||hay.includes(search));

}
function visibleConnections(){

function lonRange(){const b=map.getBounds(),pad=45;return{w:b.getWest()-pad,e:b.getEast()+pad};}
function offsetsLon(lon){const r=lonRange(),s=Math.floor((r.w-lon)/360),e=Math.ceil((r.e-lon)/360);return Array.from({length:e-s+1},(_,i)=>(s+i)*360);}
function offsetsRoute(route){const r=lonRange(),l=route.map(x=>x[1]),mn=Math.min(...l),mx=Math.max(...l),s=Math.floor((r.w-mx)/360),e=Math.ceil((r.e-mn)/360);return Array.from({length:e-s+1},(_,i)=>(s+i)*360);}

function size(p){return p.category==="chokepoint"?20:12+((p.metro||0.1)/37)*22;}

function renderStats(){
 const v=visiblePoints(), c=v.filter(p=>p.category!=="chokepoint"), ch=v.length-c.length, pop=c.reduce((s,p)=>s+(p.metro||0),0), gdp=c.reduce((s,p)=>s+(p.economy?.gdp||0),0);
 $("stats").innerHTML=`<div class="stat"><span>표시 지점</span><strong>${v.length}</strong></div><div class="stat"><span>도시</span><strong>${c.length}</strong></div><div class="stat"><span>요충지</span><strong>${ch}</strong></div><div class="stat"><span>광역권 인구</span><strong>${fmt(pop)}M</strong></div><div class="stat"><span>GDP/GRP 합계</span><strong>${money(gdp)}</strong></div>`;
}
function renderMap(){
 if(!map)return; pointLayer.clearLayers(); lineLayer.clearLayers(); bufferLayer.clearLayers(); heatLayer.clearLayers();
 const styles={rail:{color:"#67e8f9",weight:3,opacity:.85,dashArray:"8 7"},road:{color:"#fbbf24",weight:3,opacity:.85},air:{color:"#a78bfa",weight:2.5,opacity:.75,dashArray:"2 8"},sea:{color:"#38bdf8",weight:3,opacity:.78,dashArray:"14 8"}};
 visibleConnections().forEach(c=>offsetsRoute(c.route).forEach(o=>L.polyline(shift(c.route,o),{...styles[c.type],interactive:true}).bindTooltip(c.label,{sticky:true}).addTo(lineLayer)));
 visiblePoints().forEach(p=>{
  if(bufferKm>0) offsetsLon(p.lon).forEach(o=>L.circle([p.lat,p.lon+o],{radius:bufferKm*1000,color:p.category==="chokepoint"?"#f97316":"#fb7185",weight:1.5,fillOpacity:.06}).addTo(bufferLayer));

}
function renderInfo(){
 const p=get(selectedId)||visiblePoints()[0]||GIS_DATA.points[0]; if(!p)return err("표시할 지점이 없음"); selectedId=p.id;
 const rel=GIS_DATA.connections.filter(c=>c.from===p.id||c.to===p.id);
 const ind=p.category==="chokepoint"?`<h3>운하·해협 경제 지표</h3><div class="grid"><div class="mini"><span>연간 선박 통과량</span><strong>${p.chokepoint?.ships?fmt(p.chokepoint.ships)+"척":"대체 항로"}</strong></div><div class="mini"><span>연간 화물량</span><strong>${p.chokepoint?.cargo?fmt(p.chokepoint.cargo)+"Mt":"자료 없음"}</strong></div><div class="mini"><span>세계 무역 영향도</span><strong>${p.chokepoint?.trade?p.chokepoint.trade+"%":"우회 항로"}</strong></div><div class="mini"><span>통행료/수입</span><strong>${p.chokepoint?.revenue?money(p.chokepoint.revenue):"직접 통행료 없음"}</strong></div></div><div class="tags"><span class="tag">주요 화물: ${p.chokepoint?.cargoType}</span><span class="tag">리스크: ${p.chokepoint?.risk}</span></div>`:`<h3>도시 경제 지표</h3><div class="grid"><div class="mini"><span>광역권 GDP/GRP</span><strong>${money(p.economy?.gdp)}</strong></div><div class="mini"><span>1인당 GDP</span><strong>${pc(p.economy?.perCapita)}</strong></div><div class="mini"><span>주요 본사 수</span><strong>${p.economy?.hq||0}개</strong></div><div class="mini"><span>항만 화물량</span><strong>${p.economy?.port?fmt(p.economy.port)+"Mt":"내륙/소규모"}</strong></div><div class="mini"><span>공항 이용객</span><strong>${p.economy?.airport?fmt(p.economy.airport)+"M":"자료 없음"}</strong></div><div class="mini"><span>경제 역할</span><strong>${p.economy?.role||""}</strong></div></div>`;
 $("info").innerHTML=`<div class="titleRow"><div><h2>${p.ko} <span style="color:#9fb0d0;font-size:16px">${p.name}</span></h2><p style="color:#9fb0d0">${p.country} · ${p.region}</p></div><span class="badge">${p.category==="chokepoint"?"Chokepoint":"Score "+p.score}</span></div><p style="color:#c8d4ec;line-height:1.65">${p.category==="chokepoint"?"세계 해상 교통과 공급망에 영향을 주는 경제적 요충지입니다.":"주요 도시권의 경제·산업·교통 연결 정보를 표시합니다."}</p><div class="grid"><div class="mini"><span>좌표</span><strong>${p.lat}, ${p.lon}</strong></div><div class="mini"><span>${p.category==="chokepoint"?"영향도 점수":"광역권 인구"}</span><strong>${p.category==="chokepoint"?p.score:fmt(p.metro)+"M"}</strong></div><div class="mini"><span>도시화율</span><strong>${p.urban||0}%</strong></div><div class="mini"><span>연결 경로 수</span><strong>${rel.length}</strong></div></div>${ind}<h3 style="margin-top:18px">산업/기능</h3><div class="tags">${p.industries.map(x=>`<span class="tag">${x}</span>`).join("")}</div><h3 style="margin-top:18px">기업/기관</h3><div class="tags">${p.companies.map(x=>`<span class="tag">${x}</span>`).join("")}</div><h3 style="margin-top:18px;margin-bottom:10px">연결된 교통망</h3>${rel.length?rel.map(c=>{const o=get(c.from===p.id?c.to:c.from);return `<div class="conn"><span class="type type-${c.type}">${c.type.toUpperCase()}</span><span>${p.ko} ↔ ${o?.ko||"?"}<br><small style="color:#95a7c8">${c.label}</small></span></div>`}).join(""):"<p style='color:#9fb0d0'>연결 경로 없음</p>"}`;
}
function renderList(){
 $("list").innerHTML=visiblePoints().sort((a,b)=>(b.score||0)-(a.score||0)).map(p=>`<div class="row" onclick="selectPoint('${p.id}')"><div><b>${p.ko} / ${p.name}</b><span>${p.country} · ${p.category==="chokepoint"?"경제 요충지":"광역권 "+fmt(p.metro)+"M"}</span></div><span class="pill ${p.category==="chokepoint"?"orange":""}">${p.category==="chokepoint"?"요충지":p.score}</span></div>`).join("");
}
function selectPoint(id){selectedId=id;renderAll();$("info").scrollIntoView({behavior:"smooth",block:"nearest"});}
function fitAll(){const v=visiblePoints(); if(v.length)map.fitBounds(L.latLngBounds(v.map(p=>[p.lat,p.lon])).pad(.25),{animate:true,maxZoom:3});}
function focusSelected(){const p=get(selectedId); if(p)map.setView([p.lat,p.lon],6,{animate:true});}
function dist(a,b){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng),la1=rad(a.lat),la2=rad(b.lat),h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function mapClick(e){if(!measure)return;measurePts.push(e.latlng);L.circleMarker(e.latlng,{radius:5,color:"#f43f5e",fillColor:"#f43f5e",fillOpacity:.9}).addTo(measureLayer);if(measurePts.length>1)L.polyline([measurePts.at(-2),measurePts.at(-1)],{color:"#f43f5e",weight:3,dashArray:"6 6"}).addTo(measureLayer);updateMeasure();}
function updateMeasure(){if(!measure){$("measureBox").textContent="거리 측정 모드 OFF";return;}let t=0;for(let i=1;i<measurePts.length;i++)t+=dist(measurePts[i-1],measurePts[i]);$("measureBox").textContent=`거리 측정 모드 ON · 점 ${measurePts.length}개 · 총 거리 ${fmt(t)}km`;}
function clearMeasure(){measurePts=[];measureLayer.clearLayers();updateMeasure();}
function exportGeoJSON(){const features=visiblePoints().map(p=>({type:"Feature",properties:{...p},geometry:{type:"Point",coordinates:[p.lon,p.lat]}}));const blob=new Blob([JSON.stringify({type:"FeatureCollection",features},null,2)],{type:"application/geo+json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="visible_points.geojson";a.click();URL.revokeObjectURL(url);}
document.addEventListener("DOMContentLoaded",init);
</script>
</body></html>
